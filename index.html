  <body class="font-poppins">
    <div id="root"></div>

    <script>
      (() => {
        const BASE = "/tulie93kk94";

        function normalizeUrl(value) {
          if (!value || typeof value !== "string") return value;
          if (value.startsWith("http://") || value.startsWith("https://") || value.startsWith("data:") || value.startsWith("//") || value.startsWith("#") || value.startsWith("mailto:") || value.startsWith("tel:")) {
            return value;
          }

          if (value.startsWith("/") && !value.startsWith(BASE + "/")) {
            return BASE + value;
          }

          if (value.startsWith("./") || value.startsWith("../") || value.startsWith("imgi_")) {
            return new URL(value, window.location.origin + BASE + "/").toString();
          }

          return value;
        }

        function fixElement(element) {
          if (!element) return;

          const src = element.getAttribute("src");
          if (src) {
            const fixed = normalizeUrl(src);
            if (fixed && fixed !== src) element.setAttribute("src", fixed);
          }

          const srcset = element.getAttribute("srcset");
          if (srcset) {
            const fixedSrcset = srcset.split(",").map(part => {
              const trimmed = part.trim();
              if (!trimmed) return trimmed;
              const [url, ...rest] = trimmed.split(/\s+/);
              const normalized = normalizeUrl(url);
              return normalized + (rest.length ? " " + rest.join(" ") : "");
            }).join(", ");

            if (fixedSrcset !== srcset) element.setAttribute("srcset", fixedSrcset);
          }

          const style = element.getAttribute("style");
          if (style && /url\(/i.test(style)) {
            const fixedStyle = style.replace(/url\((['"]?)([^)]+?)\1\)/gi, (match, quote, url) => {
              const normalized = normalizeUrl(url);
              return `url(${quote}${normalized}${quote})`;
            });
            if (fixedStyle !== style) element.setAttribute("style", fixedStyle);
          }
        }

        function scan() {
          document.querySelectorAll("img, source, video, image, picture").forEach(fixElement);
          document.querySelectorAll("[style*"]").forEach(el => {
            const style = el.getAttribute("style");
            if (style && /url\(/i.test(style)) {
              fixElement(el);
            }
          });
        }

        scan();

        const observer = new MutationObserver(() => scan());
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src", "srcset", "style"]
        });
      })();
    </script>
